<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variety Shoemart — Store Management</title>
  <meta name="description" content="Complete store management system for Variety Shoemart — track stock and sales in real time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" role="alert" aria-live="polite"></div>

  <!-- Mobile Overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- ═══ SIDEBAR ══════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">👟</div>
        <div class="logo-text">
          <span class="logo-brand">Variety</span>
          <span class="logo-sub">Shoemart</span>
        </div>
      </div>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">✕</button>
    </div>

    <nav class="sidebar-nav">
      <p class="nav-label">Overview</p>
      <a href="#" class="nav-item active" data-view="dashboard" id="nav-dashboard">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>

      <p class="nav-label">Inventory</p>
      <a href="#" class="nav-item" data-view="stock" id="nav-stock">
        <span class="nav-icon">📦</span><span>Stock Management</span>
      </a>

      <p class="nav-label">Sales</p>
      <a href="#" class="nav-item" data-view="sales" id="nav-sales">
        <span class="nav-icon">🛒</span><span>Sales Management</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sync-badge" id="sync-status">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-label">Connecting…</span>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN ══════════════════════════════════════════════ -->
  <main class="main-content" id="main-content">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <button class="btn-icon" id="btn-refresh" title="Refresh data">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0115.3-2.7M20 15a8 8 0 01-15.3 2.7"/>
          </svg>
          Refresh
        </button>
      </div>
    </header>

    <!-- View Container -->
    <div class="view-container" id="view-container">
      <div class="loading-screen" id="loading-screen">
        <div class="spinner"></div>
        <p>Loading store data…</p>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
